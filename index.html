<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "decimal.js": "https://esm.sh/decimal.js@10.5.0"
      }
    }
  </script>
  <title>p display</title>
</head>
<body>

  <div class="notice" role="status" aria-live="polite">@Jad</div>
  <div class="thanks" id="thanksNotif" role="status" aria-live="polite">nothing in here</div>

  <div class="page-p">
    <div class="label small">t.p</div>
    <div class="big" id="pSmall">0</div>
  </div>



    <header class="top">
      <div style="position:fixed; top:12px; right:12px; z-index:90; display:flex; gap:8px; align-items:center;">
        <button id="donateBtn" class="btn small" title="Tip the creator (min 10, max 25000)">Donate</button>
      </div>
    </header>

    <main class="center">
      <div class="big big-center" id="pRaw">0</div>
    </main>

    <!-- sections overview (mid-page) -->
    <section id="sectionsPanel" class="sections-panel" aria-label="Sections overview" style="position:fixed; right:12px; top:140px; z-index:88;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
        <strong>Sections</strong>
        <button id="sectionsClose" class="btn small" style="min-width:40px;padding:6px 8px;">Close</button>
      </div>
      <div id="sectionsList" style="display:flex;flex-direction:column;gap:6px;font-weight:700;color:#0f172a;background:rgba(255,255,255,0.96);padding:8px;border-radius:8px;">
        <div class="section-item small" aria-hidden="true">Limit of Extending to AFN (6.5 to 7.05 skip this if u want)</div>
        <div class="section-item small" aria-hidden="true">AFN to EVERYANAGIO (7.05 to 7.35)</div>
        <div class="section-item small" aria-hidden="true">EVERYANAGIO to Instary (7.35 to 7.45)</div>
        <div class="section-item small" aria-hidden="true">Instary to Westran-TVgeon (7.45 to 8)</div>
        <div class="section-item small" aria-hidden="true">Westran-TVgeon to Ultimus Worldius (8 to 9)</div>
     
    </div>
    </section>

    <footer class="controls">
      <div class="controls-group">
        <div class="group-row">
          <button id="reset" class="btn">Reset t.p = 0</button>
        </div>

        <div class="group-row set-p-row">
          <label for="setPVal" class="speed-label">Set t.p</label>
          <input id="setPVal" type="number" step="0.001" min="-4" max="4" value="0" aria-label="set p value" />
          <button id="setP" class="btn small">Set t.p</button>
        </div>
      </div>

      <div class="controls-group">
        <div class="group-row">
          <label for="speed" class="speed-label">Speed</label>
          <input id="speed" type="number" min="-10" step="0.01" value="1" aria-label="automator speed multiplier" />
          <button id="pause" class="btn alt">Pause</button>
          <button id="ambienceToggle" class="btn small" aria-pressed="true">Ambience: On</button>
          <button id="textAlignToggle" class="btn small" aria-pressed="false">Text: Center</button>
        </div>
      </div>
    </footer>

    

    <!-- primary celebration sound (played once when the thanks notification appears) -->
    <audio id="celebration" src="celebration.mp3" preload="auto"></audio>

    <!-- extra loud celebratory sting for big milestones -->
    <audio id="celebrationBig" src="celebration_big.mp3" preload="auto"></audio>

    

  <script type="module" src="main.js"></script>
</body>
</html>
